[[repo]]
key = "slack-task-runner"
github = "your-org/slack-task-runner"
default_branch = "main"

[repo.match]
project_gid = "1209044193035773"

# ── Ops モード（Slack チャンネル監視 → スキル自動実行） ──

[[repo]]
key = "hikken_schedule"
github = "amu-tazawa-scripts/hikken_schedule"
ops_channel = "必見自動化"
ops_monitor = true
ops_description = "必見パチ/スロの「▼サブカテ追加」「▼クローズ対応」指示のみ。障害報告・確認依頼・雑談はスコープ外"
ops_request_examples = [
    """お疲れ様です！新企画が追加となりましたのでサブカテ追加と必見自動化のご対応よろしくお願い致します。
イベント管理No.269：オリジナル取材
▼サブカテ追加
推し活リサーチ
エヌワン東西団結取材
スロット増台店舗潜入取材""",
    "▼クローズ対応 イベント管理No.156 期間終了分のクローズをお願いします",
    """▼サブカテ追加お願いします
管理No.351 大和の神
- 天照大御神
- 須佐之男命
- 月読命""",
]
ops_skills = [".claude/skills/ops/SKILL.md"]
ops_download_dir = "images"

[[repo]]
key = "send_survey_mail"
github = "amu-tazawa-scripts/send_survey_mail"
ops_channel = "amz_結果アンケート自動化"
ops_monitor = true
ops_description = "結果アンケートの送信設定追加・サブカテ登録。GASベースのスプレッドシート操作"
ops_request_examples = [
    """アンケート変更希望案件
イベント管理NO: 269
イベント商材名: オリジナル取材
追加サブカテゴリ: 推し活リサーチ
事後レポートオプション: 必要
データ抽出: 空白
レポート: 要""",
    "新規サブカテゴリ追加お願いします。管理No.351 大和の神 → 天照大御神/須佐之男命/月読命",
    "アンケート設定変更 No.123 テンプレートURL更新",
]
ops_skills = [".claude/skills/ops/SKILL.md"]
ops_download_dir = "downloads"

[[repo]]
key = "favorite_pop"
github = "amu-tazawa-scripts/favorite_pop"
ops_channel = "amz_企画チーム_自動化支援"
ops_monitor = true
ops_mode = "plan"
ops_description = "favorite_popの新規取材タイプ追加。YAML設定・テンプレート作成の定型作業"
ops_request_examples = [
    """新規取材タイプ追加お願いします
取材名: 推し活リサーチ
カテゴリ: オリジナル取材
テンプレート: 既存の○○取材と同じ""",
    "favorite_pop に新しい取材タイプ「東の極」を追加してください",
    "新規取材 yaml 追加 — 管理No.269 ジャグリーグ取材",
]
ops_skills = [".claude/skills/ops/SKILL.md"]

[[repo]]
key = "amu-tazawa-scripts"
github = "amu-tazawa-scripts"
ops_channel = "amz_企画チーム_自動化支援"
ops_monitor = true
ops_mode = "plan"
ops_description = "上記スコープに該当しない汎用依頼。amu-tazawa-scripts モノリポ全体を対象とした調査・分析・作業計画"
ops_request_examples = [
    "○○のスクリプトのバグ調査お願いします。エラーログは別添",
    "新しい自動化スクリプトを作りたい。要件: ●●を毎日 ●● して Slack に通知",
    "既存の ●●_pickup を改修して △△ にも対応させたい",
]

# ── 自己改善（self-improvement）──────────────
[[repo]]
key = "self"
github = "tazawa-masayoshi/ambient-task-agent"
default_branch = "main"
auto_execute = true

[[repo.mcp_servers]]
name = "serena"
command = "uvx"
args = ["--from", "git+https://github.com/oraios/serena", "serena", "start-mcp-server", "--context", "autonomous-agent"]
# --project は McpConfigBuilder が実行時に注入

# ── スケジュールジョブ ──────────────────────
# cron 式: "sec min hour day_of_month month day_of_week year"

[[schedule]]
key = "morning_briefing"
cron = "0 0 9 * * Mon-Fri *"    # 平日 9:00
job_type = "morning_briefing"
prompt = ""  # デフォルトプロンプト使用（構造化済み）

[[schedule]]
key = "evening_summary"
cron = "0 0 18 * * Mon-Fri *"   # 平日 18:00
job_type = "evening_summary"
prompt = ""  # デフォルトプロンプト使用（構造化済み）

[[schedule]]
key = "meeting_reminder"
cron = "0 */5 8-20 * * Mon-Fri *"   # 平日 8-20時、5分間隔
job_type = "meeting_reminder"
prompt = ""

[[schedule]]
key = "stagnation_check"
cron = "0 0 14 * * Mon-Fri *"       # 平日 14:00
job_type = "stagnation_check"
prompt = ""

[[schedule]]
key = "weekly_pm_review"
cron = "0 0 17 * * Fri *"           # 毎週金曜 17:00
job_type = "weekly_pm_review"
prompt = ""

[[schedule]]
key = "self_improvement"
cron = "0 0 10 * * Mon *"           # 毎週月曜 10:00
job_type = "self_improvement"
prompt = ""
